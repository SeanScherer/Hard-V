### "Tier 1" / Basic Tech level buildings

# Middle / Second Row

# OrbitalPad - coming to like "LandingZone" right now :) .
# Desc.: Ordered Troops get dropped off here (and [parceled} buildings ? in future)

AIRSUPPLYPAD:
	Inherits: ^BaseBuilding
	Inherits@Shape: ^2x2Shape
	Inherits@Flame: ^BuildingFlame2
	Inherits@Disable: ^DisableOnLowPowerOrPowerDown
	Selectable:
		Bounds: 2048, 2048
	Tooltip:
		Name: actor-dropzone.name
	TooltipDescription:
		Description: actor-dropzone.description
	Buildable:
		Queue: Building
		Prerequisites: ~structures.sc
		BuildPaletteOrder: 21
		Description: actor-dropzone.description
	Valued:
		Cost: 100
	ProvidesPrerequisite@BuildingName:
	Building:
		Footprint: x+x +++ x+x
		Dimensions: 3,3
	Targetable:
		TargetTypes: Ground, Structure
	Health:
		HP: 80000
	Armor:
		Type: Steel
	RevealsShroud:
		Range: 6c0
		MinRange: 3c0
		RevealGeneratedShroud: False
		RequiresCondition: !disabled
	RevealsShroud@Hacked:
		Range: 3c0
	RevealsShroud@Offline:
		Range: 3c0
		RevealGeneratedShroud: False
		RequiresCondition: disabled
	Power:
		Amount: -40


