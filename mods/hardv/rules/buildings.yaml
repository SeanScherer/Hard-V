# RET-Center / Recruitment + Recreation Facility
# Desc.: The Recruitment Facility - required for ordering basic (light) troops
# Its also the basic Tier 1 building that unlocks many of the other basic/ Tier 1 buildings

MODULE:
	-RepairsUnits:
	Buildable:
		BuildPaletteOrder: 22
	Valued:
		Cost: 100

# MODULE2:
#	Production:
#		Produces: LTMV
## Light Terrain Mobile Vehicles

FACTORY:
	Buildable:
		Prerequisites: module, generator, ~structures.sc
		BuildPaletteOrder: 23
	Valued:
		Cost: 200

FACTORY2:
	Buildable:
		Prerequisites: module, generator, ~structures.yi
		BuildPaletteOrder: 23

# Bottom / Third row

# Sorted - essentially by cost (and perhaps by secondarily by belligerency :P)

FIELDREPAIR:
	Inherits: ^BaseBuilding
	Inherits@Shape: ^2x1Shape
	Inherits@Flame: ^BuildingFlame
	Inherits@Disable: ^DisableOnLowPowerOrPowerDown
	Selectable:
		Bounds: 2048, 2457, 0, -204
	Buildable:
		Queue: Building
		BuildPaletteOrder: 31
		Prerequisites: module, ~structures.sc
		Description: actor-fieldrepair.description
	Valued:
		Cost: 160
	Tooltip:
		Name: actor-fieldrepair.name
	Encyclopedia:
		Description: actor-fieldrepair.encyclopedia
		Order: 40
		Category: Buildings
	Building:
		Footprint: == xx
		Dimensions: 2,2
	HitShape:
		UseTargetableCellsOffsets: true
		TargetableOffsets: -512,0,0
		Type: Rectangle
			TopLeft: -1024, 0
			BottomRight: 1024, 1024
	Targetable:
		TargetTypes: Ground, Structure
	Health:
		HP: 100000
	Armor:
		Type: Steel
	RevealsShroud:
		Range: 5c0
		MinRange: 2c0
		RevealGeneratedShroud: False
		RequiresCondition: !disabled && !build-incomplete && !beam-incomplete
	RevealsShroud@Offline:
		Range: 2c0
		RequiresCondition: disabled
		RevealGeneratedShroud: False
	RevealsShroud@Hacked:
		Range: 2c0
	Power:
		Amount: -40
	WithIdleOverlay@Lights:
		Sequence: animation-lights
		RequiresCondition: !disable-lights && !build-incomplete && !beam-incomplete && !disabled
	GrantConditionOnDamageState@BrokenLights:
		Condition: disable-lights
		ValidDamageStates: Heavy, Critical
	ProvidesPrerequisite@BuildingName:
		Prerequisite: fieldrepair
		RequiresCondition: !powerdown
	RepairsUnits:
		HpPerStep: 1000
		Interval: 7
		PlayerExperience: 15
		StartRepairingNotification: Repairing
		StartRepairingTextNotification: notifications-repairing
		FinishRepairingNotification: UnitRepaired
		FinishRepairingTextNotification: notification-unit-repaired
		RequiresCondition: !powerdown

