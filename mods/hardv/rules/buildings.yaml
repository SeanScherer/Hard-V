## Player built buildings
################################

# Top row (from left to right, three spots) - Tier "0"

# Headquarters -> the Building you start the game with!

BASE:
	GrantConditionOnDamageState:
		Condition: damaged
		ValidDamageStates: Medium, Heavy, Critical
	ProvidesRadar:
		RequiresCondition: !disabled && !build-incomplete && !beam-incomplete && !damaged
	Valued:
		Cost: 700

# sort by Tech level or by function.. ? -> sort by position in build menu :P (which is kinda a mix of both :D ).

# Make outposts hold a slot (and buildable) at the BASE / HeadQuarters:

OUTPOST:
	Buildable:
		BuildPaletteOrder: 11
		Queue: Building
		Prerequisites: ~base, generator, ~structures.yi
		Description: actor-outpost.description
	Valued:
		Cost: 200

OUTPOST2:
	Buildable:
		BuildPaletteOrder: 11
		Queue: Building
		Prerequisites: ~base, generator, ~structures.sc
		Description: actor-outpost.description

# Refinery

STORAGE:
	Buildable:
		BuildPaletteOrder: 12
	Valued:
		Cost: 280

GENERATOR:
	Buildable:
		BuildPaletteOrder: 13
	Valued:
		Cost: 60

# Might give Generators a miss mid-to-long term for the Extractive-Corps / CoPaxCo... course, there might be a replacement building... (ordering Mining towers could have a spot here actually... - they need a spot in general ? :P ?! woopsie :P )

