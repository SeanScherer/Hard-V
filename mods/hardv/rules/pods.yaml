RIFLEMAN:
	Buildable:
		Queue: Pod
		Description: actor-rifleman.description
		Prerequisites: ~module.yi
		BuildPaletteOrder: 10
	Valued:
		Cost: 40

RIFLEMAN-TRACKED:
	Inherits: ^Pod
	Inherits@AutoTarget: ^AutoTargetGroundAssaultMove
	Buildable:
		Queue: Pod
		Description: actor-rifleman.description
		Prerequisites: ~module.sc
		BuildPaletteOrder: 10
	Encyclopedia:
		Description: actor-rifleman.encyclopedia
		Order: 0
		Category: Pods
	Valued:
		Cost: 40
	Tooltip:
		Name: actor-rifleman.name
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	RevealsShroud:
		Range: 6c0
		MinRange: 3c0
		RevealGeneratedShroud: False
	RevealsShroud@Hacked:
		Range: 3c0
	Armament@Primary:
		Weapon: LightMachineGun
		MuzzleSequence: muzzle
		LocalOffset: 200,0,0
	Armament@Garrisoned:
		Name: garrisoned
		Weapon: BunkerChaingun
		MuzzleSequence: muzzle
		LocalOffset: 200,0,0
	AttackFrontal:
		PauseOnCondition: jammed
		FacingTolerance: 0
		Voice: Attack
	WithMuzzleOverlay:
		IgnoreOffset: true

