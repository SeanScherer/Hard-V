# "Factions"

# PAXCO
#
## My First Stab at a Side name was "CoPac"
## Second stab :P  :
## COPAXCO
## -> *Co*lonial *Pax*/Pacification *Co*alition
## Alts: CoPax, PaxCo, PaCom + PaxCom (strictly speaking Pa[x]Co*M* -> cause Pacification of Colonies, Mutual agreement), 
#
	Faction@Maddock:
		Name: faction-maddock.name
		InternalName: mx
		Side: PaxCo
		Selectable: true
		Description: faction-maddock.description
    ## My initial name for the faction was "Maddox" (might change back)
	Faction@Yuruki:
		Name: faction-yuruki.name
		InternalName: yi
		Side: PaxCo
		Selectable: true
		Description: faction-yuruki.description


# CALUN
#
## First Stab at a Side name: SecFo
## Second stab: LUCAR
## -> *Lu*na (Security [provision]) *Car*tel
# Switch: CaLun (-> [the] *Ca*rtel of *Lun*ar Treaty Signatories - 
## Alts: LuNet, LyCar + LyNet, DynCar + DyNet (Dynamic Security [provision] Network) -> not bad either :P , 
	Faction@TriStar:
		Name: faction-tristar.name
		InternalName: dh
		Side: CaLun
		Selectable: true
		Description: faction-tristar.description
    # Original name was: "Haeundae"
    # Alts: DaeSan + DeaSam, Sam-Dae + SamDae
    # last version before current: DaeHan.
    # (came upon "Tristar" cause that's actually what "Samsung" means :P)
	Faction@Synapol:
		Name: faction-synapol.name
		InternalName: sc
		Side: CaLun
		Selectable: true
		Description: faction-synapol.description
## Random choices of Faction
	Faction@Random:
		Name: faction-randomall.name
		InternalName: Random
		RandomFactionMembers: mx, yi, dh, sc
		Side: Random
		Description: faction-randomall.description

	Faction@RandomPaxCo:
		Name: faction-randompaxco.name
		InternalName: RandomPaxCo
		RandomFactionMembers: mx, yi
		Side: Random
		Description: faction-randompaxco.description
	Faction@RandomCaLun:
		Name: faction-randomcalun.name
		InternalName: RandomCaLun
		RandomFactionMembers: dh, sc
		Side: Random
		Description: faction-randomcalun.description

